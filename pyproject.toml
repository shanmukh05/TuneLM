[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tunelm"
version = "0.2.0"
description = "Grounded Strudel music generation with LFM3, SFT, and GRPO"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["pydantic>=2.10,<3", "numpy>=1.26,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
train = ["torch>=2.8", "transformers==5.12.1", "trl==1.12.0", "peft==0.20.0", "datasets==5.0.1", "accelerate==1.12.0", "safetensors>=0.6"]
memory = ["sentence-transformers>=5,<6"]
teacher = ["openai>=1.65,<3", "google-genai>=2.9,<3", "anthropic>=0.111,<1"]
dev = ["ruff>=0.14,<1"]

[project.scripts]
tunelm = "tunelm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tunelm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
