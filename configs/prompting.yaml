schema_version: 2
# Cycle independently of task category and retrieval mode. Repeating a style
# increases its share. This 12-job schedule gives 11 nontechnical requests.
schedule: [vague, mood, genre, activity, blend, reference, musical, vague, mood, genre, activity, technical]
styles:
  vague: >-
    A short, casual, underspecified request, such as "Make something mellow".
    No numbers, instruments, theory, code, effects settings, or API names.
    Choose the missing musical details yourself.
  mood: >-
    Ask for an emotional or atmospheric quality in everyday words. No exact
    tempo/key, instrument inventory, code requirements, or effects settings.
  genre: >-
    Ask for a kind of music or groove, optionally with a mood. Do not turn genre
    into a recipe listing its usual instruments, tempo, scale, or production steps.
  activity: >-
    Ask for music for a situation, activity, listener, or background use. Describe
    the experience desired; leave tempo, key, instruments, and code choices open.
  blend: >-
    Ask for a natural fusion of two musical styles, or a contrast of mood and
    groove. No technical recipe, exact parameters, or mandatory instrument list.
  reference: >-
    Describe a setting, imagined scene, or sonic reference in plain language,
    such as a rainy futuristic city or an old arcade. Avoid named songs/artists
    and implementation instructions. Infer a fitting musical interpretation.
  musical: >-
    Use ordinary musical language with one or two preferences, such as a gentle
    bass pulse or a gradual build. Leave the rest open; do not specify code/API
    syntax or enumerate every part of the verified composition.
  technical: >-
    A producer or live-coder request with a few concrete requirements. Exact BPM,
    key, instrument roles, or supported Strudel methods are allowed when they
    match the result. Avoid copying the entire program into the request.
scenarios:
  - situation: winding down after a long day
    mood: mellow and spacious
    genres: [ambient, downtempo]
  - situation: a rainy evening indoors
    mood: warm and nostalgic
    genres: [lo-fi hip-hop]
  - situation: a small underground dance floor
    mood: hypnotic and driving
    genres: [minimal techno]
  - situation: late-night coding without distraction
    mood: calm and steady
    genres: [downtempo, ambient]
  - situation: a playful rooftop gathering
    mood: bright and relaxed
    genres: [house, jazz]
  - situation: an imaginary neon city at night
    mood: mysterious and cinematic
    genres: [synthwave]
  - situation: an energetic run
    mood: propulsive and upbeat
    genres: [drum and bass]
  - situation: a quiet moment alone
    mood: sparse and introspective
    genres: [ambient]
  - situation: a sunrise after a difficult night
    mood: hopeful and gently uplifting
    genres: [melodic electronic]
  - situation: an old arcade coming to life
    mood: playful and bouncy
    genres: [chiptune]
  - situation: a cozy cafe conversation
    mood: soft and unobtrusive
    genres: [jazz, chillhop]
  - situation: a live electronic jam
    mood: punchy and evolving
    genres: [electro, breakbeat]
