extends: model.yaml
model:
  max_seq_length: 2048
lora:
  rank: 16
  alpha: 32
data:
  train_file: datasets/sft/sample.jsonl
training:
  backend: transformers
  output_dir: checkpoints/qwen3-06b-smoke-sft
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  warmup_ratio: 0.0
  logging_steps: 1
  save_steps: 50
  save_total_limit: 1
  bf16: true
  gradient_checkpointing: true
  report_to: none
  run_name: qwen3-06b-smoke-sft
  seed: 42
