operations:
  - instruction_templates:
      - "Make the drums twice as dense while preserving tempo and melody."
      - "Double the drum density but keep the tempo and melodic content unchanged."
      - "Increase drum activity to twice the current level without altering tempo or notes."
    expected_changes: {drum_density: increase}
    preserve: [tempo, notes]

  - instruction_templates:
      - "Increase the tempo but preserve the instruments and melody."
      - "Speed up the piece while keeping the same instruments and melodic lines."
      - "Raise the BPM without changing which instruments play or the note content."
    expected_changes: {tempo: increase}
    preserve: [instruments, notes]

  - instruction_templates:
      - "Add another musical layer without changing the tempo."
      - "Introduce an additional layer while keeping tempo constant."
      - "Layer in one more musical voice without altering the BPM."
    expected_changes: {layer_count: increase}
    preserve: [tempo]

  - instruction_templates:
      - "Slow down the tempo while keeping instruments and melody intact."
      - "Decrease the BPM but preserve the instrumentation and notes."
      - "Make the piece slower without changing instruments or melodic content."
    expected_changes: {tempo: decrease}
    preserve: [instruments, notes]

  - instruction_templates:
      - "Reduce drum density by half while preserving tempo and melody."
      - "Make the drums sparser, keeping tempo and notes the same."
      - "Halve the drum activity without changing tempo or melodic lines."
    expected_changes: {drum_density: decrease}
    preserve: [tempo, notes]

  - instruction_templates:
      - "Remove one musical layer while keeping tempo unchanged."
      - "Drop a layer from the arrangement without changing the BPM."
      - "Simplify by removing one layer, preserving tempo."
    expected_changes: {layer_count: decrease}
    preserve: [tempo]

  - instruction_templates:
      - "Add a bass layer without changing tempo or drums."
      - "Introduce bass while keeping tempo and drum pattern intact."
    expected_changes: {layer_count: increase, add_instruments: [bass]}
    preserve: [tempo, drum_density]

  - instruction_templates:
