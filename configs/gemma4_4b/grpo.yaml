extends: model.yaml
model:
  adapter: checkpoints/gemma4-4b-sft
lora:
  enabled: false
data:
  train_file: datasets/rl/train.jsonl
strudel:
  backend: node
  timeout_seconds: 3
  cycles: 2
  max_events: 2048
rewards:
  format:
    enabled: true
    weight: 0.1
  execution:
    enabled: true
    weight: 0.4
  constraints:
    enabled: true
    weight: 0.5
  edit_consistency:
    enabled: true
    weight: 0.5
  repair_consistency:
    enabled: true
    weight: 0.5
training:
  backend: transformers
  output_dir: checkpoints/gemma4-4b-grpo
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.000005
  num_generations: 4
  max_completion_length: 1536
  max_steps: 200
  logging_steps: 5
  save_steps: 50
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  mask_truncated_completions: true
  log_completions: true
  report_to: wandb
  run_name: gemma4-4b-grpo
  seed: 42
