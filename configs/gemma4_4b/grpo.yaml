extends: model.yaml
model:
  adapter: checkpoints/gemma4-4b-sft
lora:
  enabled: false
data:
  train_file: datasets/rl/train.jsonl
# 8 cycles so later sections (arrange, <...>) are executed and scored.
strudel:
  backend: node
  timeout_seconds: 5
  cycles: 8
  max_events: 8192
rewards:
  format:
    enabled: true
    weight: 0.1
  execution:
    enabled: true
    weight: 0.4
  constraints:
    enabled: true
    weight: 0.5
  edit_consistency:
    enabled: true
    weight: 0.5
  repair_consistency:
    enabled: true
    weight: 0.5
  richness:
    enabled: true
    weight: 0.2
training:
  backend: transformers
  output_dir: checkpoints/gemma4-4b-grpo
  # 4 x 8 = 32 completions per step = 4 prompts x 8 samples (A100-80GB).
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 0.000005
  num_generations: 8
  max_completion_length: 2048
  max_steps: 200
  logging_steps: 5
  save_steps: 50
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  mask_truncated_completions: true
  log_completions: true
  report_to: wandb
  wandb_project: tunelm
  run_name: gemma4-4b-grpo
  seed: 42
