extends: model.yaml
model:
  name: tensorfiend/tunelm-gemma4-4b-sft-quality-20260927-86-best
  merged_sft: true
data:
  train_file: datasets/rl/quality_train.jsonl
  validation_size: 30
  compose_repeat_factor: 2
  min_compose_constraint_fraction: 0.3
# 8 cycles so later sections (arrange, <...>) are executed and scored.
strudel:
  backend: node
  timeout_seconds: 5
  cycles: 8
  max_events: 8192
rewards:
  format:
    enabled: true
    weight: 0.1
  execution:
    enabled: true
    weight: 0.4
  response_consistency:
    enabled: true
    weight: 0.3
  constraints:
    enabled: true
    weight: 0.5
  edit_consistency:
    enabled: true
    weight: 0.5
  repair_consistency:
    enabled: true
    weight: 0.5
  richness:
    enabled: true
    weight: 0.8
training:
  backend: transformers
  output_dir: checkpoints/gemma4-4b-grpo
  # 4 x 8 = 32 completions per step = 4 prompts x 8 samples (A100-80GB).
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 0.000005
  beta: 0.01
  num_generations: 8
  num_generations_eval: 2
  per_device_eval_batch_size: 2
  max_completion_length: 2048
  max_steps: 200
  logging_steps: 5
  eval_steps: 40
  save_steps: 40
  save_total_limit: 5
  bf16: true
  gradient_checkpointing: true
  mask_truncated_completions: true
  log_completions: true
  report_to: wandb
  wandb_project: tunelm
  run_name: gemma4-4b-grpo
  seed: 42
