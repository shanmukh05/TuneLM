extends: model.yaml
model:
  adapter: checkpoints/gemma4-4b-sft
  max_seq_length: 8192
lora:
  enabled: false
data:
  train_file: datasets/sft/quality_train.jsonl
  val_file: datasets/sft/quality_val.jsonl
training:
  backend: transformers
  output_dir: checkpoints/gemma4-4b-sft-quality
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.00002
  warmup_ratio: 0.03
  logging_steps: 10
  eval_count: 10
  save_steps: 100
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  report_to: wandb
  wandb_project: tunelm
  run_name: gemma4-4b-sft-quality
  seed: 42
