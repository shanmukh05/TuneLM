schema_version: 2
stage: sft
curriculum: warmup
train_file: datasets/sft/train.jsonl
val_file: datasets/sft/val.jsonl
output_dir: checkpoints/lfm3-warmup
results_dir: results/lfm3-warmup
training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  bf16: true
  gradient_checkpointing: true
  save_steps: 50
  logging_steps: 5
  report_to: none
  seed: 42
