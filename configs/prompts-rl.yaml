# One in seven is co-creation; atomic asks for one part.
categories:
- stack
- arrange
- stack
- arrange
- atomic
- stack
- cocreate
palette:
  schema_version: 2
  # No "vague": a request with nothing checkable cannot be scored, so it is rejected.
  schedule:
  - musical
  - genre
  - activity
  - groove
  - solo
  - musical
  - dialogue
  - contrast
  - technical
  - dislike
  - blend
  - restraint
  - musical
  - dance
  - reference
  - mood
  - technical
  - contrast
  openings:
  - Start with a question.
  - Start with a bare instruction and no "I".
  - Use a fragment of only a few words.
  - Start on the music itself, not the person.
  - First person is fine this time, but get to the music in the first sentence.
  - Start with what the listener does not want.
  focuses:
  - One named instrument and nothing else.
  - Two named instruments that answer each other.
  - Three specific instruments that have to fit together.
  - Name the instrument that should carry the piece.
  - A piece that starts sparse and fills in.
  - A busy section that drops to almost nothing.
  - Rhythm only, with the percussion named.
  - Music for a real task, naming the instrument that should carry it.
  - A short loop on a named instrument.
  - Something playful or harsh, with the instruments named.
  writing_guidance: Write the words one person would actually say to a musician. One voice, one
    occasion, and stop when the ask is clear. Use one to three sentences; a short ask is fine.
    Do not add a backstory, a mood paragraph, or extra adjectives to make it sound complete.
    "I'm" is fine. So is a question, a bare instruction, a fragment, or a line that starts on the music.
    Include at least two concrete things they would bother to say. Name instruments the way a person
    would (cello, tuba, kick drum, piano), how many parts, or how the piece should change. Always
    name a tempo in bpm and a key, the way a person would say them, such as 96 bpm in C minor.
    Leave production unsaid.
    Sound spoken. No playlist copy, no "sonic journey," no neon-city scene, and no artist imitation.
    Invent the occasion yourself. Do not make everything lo-fi, ambient, a loop, or background music.
    Keep it instrumental. Imagine different people, ages, cultures, countries, needs, and wants, and
    write the request from their perspective. Follow the opening and the focus in this brief.
  # Same texts as prompts-sft.yaml, minus "leave tempo and key open": RL requests state both.
  styles:
    mood: Ask for one emotion in plain language. Vary it. Joy, tenderness, tension, play, grief, calm,
      unease, anger, warmth, and excitement. Do not default to cozy, nostalgic, or sad. A few words is
      enough. A listener can mention an instrument or something they dislike, but should not sound like
      an adjective-filled playlist.
    genre: Ask for a recognizable kind of music with a few personal preferences. Named instruments, a
      hook, and contrasting parts are welcome. Avoid code settings.
    activity: A real person needs music for a video, gathering, rehearsal, workout, or other practical
      use. Include what should happen musically and why it matters to them.
    blend: Ask for two musical influences together, explaining which qualities to take from each. Include
      concrete instruments, groove, melody, or structure when useful.
    reference: Describe music for a scene or event in everyday terms, with concrete musical preferences.
      Use familiar listening experiences; avoid invented neon-city cliches and named-song copying. It
      should sound like a request, not promotional writing.
    musical: An ordinary listener or band member asks for a song, tune, instrumental, or backing track.
      They can name several instruments, describe a melody and groove, ask for an intro/chorus/ending,
      or give three or four connected preferences. Usually one to four sentences. A short direct ask is
      also fine. Do not reduce the request to one generic mood line or a list of code parameters.
      Musical complexity is welcome.
    technical: An occasional live-coder or producer request with a few concrete requirements. Exact BPM,
      key, or supported Strudel methods are allowed when appropriate.
    groove: The request is about rhythm and how parts lock. Talk about pocket, swing, push, rests, or
      a pattern someone could nod to. A couple of instruments is enough. Do not name any Strudel call,
      and do not turn it into a genre essay or a scene description.
    dialogue: 'Ask for parts that answer each other: a phrase and a reply, a bass that reacts, or a melody
      that leaves room for another line. The listener cares about that conversation. Do not fill the
      request with unrelated layers.'
    restraint: Ask for room. One or two ideas, pauses, and parts that stay out of the way. The listener
      wants the piece to develop without filling every moment. Do not expand it into a full band.
    solo: Ask for one instrument and nothing else. Say how it should move. Do not add drums, chords, or
      a second voice.
    contrast: Ask for a change that can be heard. Loud then quiet, busy then empty, or one part that
      disagrees with another. Say what each side does.
    dislike: The listener knows what they do not want to hear and says that first. Then say the small
      thing they do want. Do not turn the dislike into a list of studio effects.
    dance: Music for a body. Name the movement, such as a step, a sway, a jump, or a hold, and what the
      rhythm should do. Do not describe a nightclub scene.
