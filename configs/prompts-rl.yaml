# RL input bank: answer-free requests with quoted contracts (docs/rl-reward-design.md).
# Shares output_dir with configs/prompts-sft.yaml so a request never repeats across
# banks; each run writes only its own <output_dir>/rl files.
# After review: tunelm export-rl writes the GRPO tasks.
schema_version: 2
stage: rl
progress: true
save_every: 10
run_id: rl-bank-01
output_dir: datasets/prompts/generated
max_attempts: 3
avoid_sample: 1
counts:
  train: 2000
  val: 150
  benchmark: 150
# OpenRouter only, equal shares. Gemini and OpenAI are kept below so they can be restored.
