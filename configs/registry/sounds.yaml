# Sound names are the map keys. The verifier accepts those keys.
# meaning / musical_use / pitfall describe the name. The composer prompt includes
# meaning for unbanked and gm_* names; banked drums reuse the role through bank().
schema_version: 2
version: strudel-sound-catalog-20261110-described
source: https://strudel.cc/tidal-drum-machines.json
source_sha256: aa5a8c9849593b2682932693efe0cd399d58821c32dc32e09297404641214477
additional_sources:
- source: https://strudel.cc/workshop/first-notes/
  notes: Documented default REPL sounds piano, gm_electric_guitar_muted, gm_acoustic_bass; names checked
    2026-11-09. No sample audio downloaded.
- source: https://strudel.cc/learn/faq/
  notes: Documented gm_acoustic_guitar_steel and gm_tremolo_strings; names checked 2026-11-09. No composition
    snippets imported.
- source: https://raw.githubusercontent.com/tidalcycles/uzu-drumkit/2f3e05c70ab4d73ad053a1467adec89bd27377a0/strudel.json
  source_sha256: b2188ca483d3201a56ffa226bbd94a595853335db06dbf08c3284074f034402b
  notes: Default unbanked drum names only; no sample audio is downloaded.
- source: https://registry.npmjs.org/@strudel/soundfonts/-/soundfonts-1.2.6.tgz
  member: package/gm.mjs
  source_sha256: a7ccda9ebb624c268f06da7a5627f56c51eb96bb2e71344a9def2500f65db6a3
  notes: Active GM keys parsed from the pinned official package; no JS executed, package installed, or
    audio downloaded.
description_basis: 'Drum-role sentences follow the Strudel samples lesson (https://strudel.cc/learn/samples/,
  checked 2026-11-10): bd, sd, rim, cp, hh, oh, cr, rd, ht, mt, lt, sh, cb, tb, perc, misc, fx. Waveforms
  sine, sawtooth, square, and triangle, plus white, pink, and brown noise, follow the synths lesson (https://strudel.cc/learn/synths/).
  gm_* labels are the General MIDI program names in the pinned soundfont package, grouped by the GM family.
  brk, noise, supersaw, and OberheimDMX_ are catalog names those two lessons do not define; their entries
  say so instead of guessing a technique. The composer prompt includes the meaning for each unbanked
  and gm_* name. Banked drums are not repeated; bank() selects the same role.'
sounds:
  bd:
    meaning: Bass drum, also called a kick. Default sample-map abbreviation from the Strudel samples lesson.
    musical_use: Play it with s("bd"). A banked name ending in _bd is this same role on that machine.
    pitfall: 'From the Strudel samples lesson: bank() prepends a machine name, and n() picks another recording
      of this role (from 0) and wraps. n() does not set pitch. Some banks omit this role.'
  brk:
    meaning: Default unbanked name from the pinned Uzu drum kit. The Strudel samples lesson does not define
      brk.
    musical_use: The catalog accepts the name. No role from the samples table is implied.
    pitfall: Do not treat brk as a kick, snare, hat, or other documented abbreviation.
