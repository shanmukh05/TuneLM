  brown:
    meaning: Noise waveform, the softest of white, pink, and brown.
    musical_use: Use a short decay for hats and texture. Pitch is not what distinguishes these three.
    pitfall: Documented on the Strudel synths lesson. .noise() on another oscillator is an amount, not
      this sample name.
  noise:
    meaning: Catalog name. The synths lesson does not list noise as one of its waveforms.
    musical_use: Prefer white, pink, or brown when a documented noise flavor is intended.
    pitfall: The lesson uses .noise() as an amount added to an oscillator, and names white, pink, and
      brown as the noise waveforms.
  pink:
    meaning: Noise waveform, softer than white and harder than brown.
    musical_use: Use a short decay for hats and texture. Pitch is not what distinguishes these three.
    pitfall: Documented on the Strudel synths lesson. .noise() on another oscillator is an amount, not
      this sample name.
  sawtooth:
    meaning: Basic synthesizer waveform.
    musical_use: Select it with s("sawtooth") or sound("sawtooth"), then set pitch with note().
    pitfall: These four names are the basic set on the Strudel synths lesson. A waveform is not a recorded
      instrument.
  sine:
    meaning: Basic synthesizer waveform.
    musical_use: Select it with s("sine") or sound("sine"), then set pitch with note().
    pitfall: These four names are the basic set on the Strudel synths lesson. A waveform is not a recorded
      instrument.
  square:
    meaning: Basic synthesizer waveform.
    musical_use: Select it with s("square") or sound("square"), then set pitch with note().
    pitfall: These four names are the basic set on the Strudel synths lesson. A waveform is not a recorded
      instrument.
  supersaw:
    meaning: Catalog waveform name. The synths lesson's basic set is sine, sawtooth, square, and triangle.
    musical_use: Select it with s("supersaw") because this catalog accepts it.
    pitfall: No description of supersaw is given on the basic-waveforms section, so this entry does not
      claim a playing technique.
  triangle:
    meaning: Basic synthesizer waveform. Strudel uses triangle when note() is set and sound() is not.
    musical_use: Select it with s("triangle") or sound("triangle"), then set pitch with note().
    pitfall: These four names are the basic set on the Strudel synths lesson. A waveform is not a recorded
      instrument.
  white:
    meaning: Noise waveform. The synths lesson orders white, pink, brown from hard to soft.
    musical_use: Use a short decay for hats and texture. Pitch is not what distinguishes these three.
    pitfall: Documented on the Strudel synths lesson. .noise() on another oscillator is an amount, not
      this sample name.
  piano:
    meaning: Built-in sample named piano, distinct from gm_piano.
    musical_use: Play it with s("piano") or note().s("piano").
    pitfall: Cited as a default REPL sound in this file's additional sources. It is not the General MIDI
      acoustic grand.
