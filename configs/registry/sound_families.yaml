# Closed families for RL request contracts. A contract may only name these keys.
# sounds: exact executed names from sounds.yaml. Families may overlap.
# kit_pieces: drum-machine suffixes; "bd" and "RolandTR909_bd" both match "bd".
# low_notes: a pitched onset at or below MIDI 48 (C3) also counts, so a synth bass line is a bass.
# A listener word with no family here (clay pot, sledgehammer) is left out of the contract.
schema_version: 2
families:
  drums:
    kit_pieces: [bd, sd, hh, oh, ht, mt, lt, cr, cp, perc, rim, cb, rd, sh, tb, misc, brk, fx]
    sounds: [gm_synth_drum, gm_taiko_drum, gm_melodic_tom, gm_reverse_cymbal]
  kick:
    kit_pieces: [bd]
  snare:
    kit_pieces: [sd, rim]
  hi_hat:
    kit_pieces: [hh, oh]
  clap:
    kit_pieces: [cp]
  cymbal:
    kit_pieces: [cr, rd]
    sounds: [gm_reverse_cymbal]
  cowbell:
    kit_pieces: [cb]
  tom:
    kit_pieces: [ht, mt, lt]
    sounds: [gm_melodic_tom]
  shaker:
