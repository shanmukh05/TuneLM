schema_version: 2
stage: sft
hub:
  org: tensorfiend
  model: lfm3-1.7B
  repo: tunelm-v2-{model}-{stage}-{which}-{time}
  private: true
  metric: eval_loss
  greater_is_better: false
train_file: datasets/samples/sft/train.jsonl
val_file: datasets/samples/sft/val.jsonl
output_dir: checkpoints/lfm3-sft
results_dir: results/lfm3-sft
training:
  num_train_epochs: 4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  # 25 steps warmed the original 504-step schedule. Extra epochs resume that run.
  warmup_steps: 25
  bf16: true
  gradient_checkpointing: true
  eval_strategy: steps
  eval_steps: 50
  save_steps: 50
  logging_steps: 5
  save_total_limit: 2
  report_to: wandb
  run_name: lfm3-sft
  seed: 42
