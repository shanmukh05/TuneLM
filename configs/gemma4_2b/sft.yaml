extends: model.yaml
data:
  train_file: datasets/sft/train.jsonl
training:
  backend: transformers
  output_dir: checkpoints/gemma4-2b-sft
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.05
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  report_to: none
  run_name: gemma4-2b-sft
  seed: 42
