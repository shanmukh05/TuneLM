# Generate train and validation answers for the listener prompt bank.
schema_version: 2
progress: true
save_every: 10  # Refresh dataset JSONL after this many newly accepted records.
run_id: listener-sft-01
prompts_dir: datasets/prompts/listener
dataset_dir: datasets/samples/listener
references: optional
memory_dir: datasets/memory
context_tokens: 16384
max_attempts: 3
# Write each provider model id on model. Names are not read from the environment.
models:
  - id: gemini-composer
    provider: gemini
    model: gemini-3.8-flash
    fraction: 1.0
    max_tokens: 16384
    thinking_level: low
